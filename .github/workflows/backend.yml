name: Backend and account checks

on:
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', 'tests/**', 'scripts/**', 'docker/**', 'docker-compose*.yml', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'frontend/**', 'tests/**', 'scripts/**', 'docker/**', 'docker-compose*.yml', '.github/workflows/backend.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: strobot_test
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: strobot_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U strobot_test -d strobot_ci_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://strobot_test:ci-disposable-only@localhost:5432/strobot_ci_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install and generate
        working-directory: backend
        run: npm ci && npm run prisma:generate
      - name: Apply production migrations and initialize twice
        working-directory: backend
        run: npm run db:migrate && npm run db:seed && npm run db:seed
      - name: Compile and test backend
        working-directory: backend
        run: npm run build && npm run typecheck && npm test
      - name: Check compiled initialization under a constrained heap
        shell: bash
        run: |
          strobot_fixture="$(mktemp)"
          trap 'rm -f "$strobot_fixture"' EXIT
          node - "$strobot_fixture" <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync(process.argv[2], JSON.stringify({
            NODE_ENV: 'test', DATABASE_URL: process.env.DATABASE_URL,
          }), { mode: 0o600 });
          NODE
          python3 tests/compiled-setup-smoke.py --env-file "$strobot_fixture"
      - name: Account and learning storage regression checks
        run: >-
          node tests/account-service.mjs &&
          node tests/account-connection.mjs &&
          node tests/account-dashboard.mjs &&
          node tests/ai-admin-setup.mjs &&
          node tests/tutor-learning-context.mjs &&
          node tests/production-start.mjs &&
          node tests/production-setup.mjs &&
          node tests/learner-sync.mjs &&
          node tests/quiz-service.mjs &&
          node tests/adaptive-review.mjs &&
          node tests/microbit-editor-bridge.mjs &&
          node tests/practice-portfolio.mjs &&
          node tests/lab-workspace.mjs
      - name: Install browser journey dependencies
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Verify student approval and cross-device learning journey
        shell: bash
        run: |
          strobot_fixture="$(mktemp)"
          trap 'rm -f "$strobot_fixture"' EXIT
          node - "$strobot_fixture" <<'NODE'
          const fs = require('node:fs');
          const { randomBytes } = require('node:crypto');
          fs.writeFileSync(process.argv[2], JSON.stringify({
            NODE_ENV: 'test', DATABASE_URL: process.env.DATABASE_URL,
            REDIS_URL: process.env.REDIS_URL,
            JWT_SECRET: randomBytes(32).toString('hex'),
            JWT_REFRESH_SECRET: randomBytes(32).toString('hex'),
            AI_CREDENTIALS_MASTER_KEY: randomBytes(32).toString('hex'),
          }), { mode: 0o600 });
          NODE
          python3 tests/product-journey-smoke.py --env-file "$strobot_fixture"
