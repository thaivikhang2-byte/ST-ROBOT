# Local full stack. Existing database volumes are preserved by normal upgrades.
x-backend: &backend
  image: strobot-backend:local
  build: ./backend
  env_file: .env
  environment: &backend-env
    DATABASE_URL: postgresql://${POSTGRES_USER:-strobot}:${POSTGRES_PASSWORD:?Generate private .env first}@postgres:5432/${POSTGRES_DB:-strobot}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: ${REDIS_PASSWORD:?Generate private .env first}
    APP_PORT: 3000
  volumes:
    - mail-outbox:/app/.mail-outbox
    - ai-vault:/app/.ai-secrets
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-strobot}
      POSTGRES_USER: ${POSTGRES_USER:-strobot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate private .env first}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Generate private .env first}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Generate private .env first}
    command: [sh, -c, 'exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    command: [sh, -c, 'npm run db:migrate && npm run db:seed']
    depends_on:
      postgres: { condition: service_healthy }
  backend:
    <<: *backend
    restart: unless-stopped
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000/api/system/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  frontend:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - 127.0.0.1:5500:80
    volumes:
      - ./frontend:/usr/share/nginx/html/frontend:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./account.html:/usr/share/nginx/html/account.html:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend: { condition: service_healthy }
volumes:
  database:
  redis:
  mail-outbox:
  ai-vault:
