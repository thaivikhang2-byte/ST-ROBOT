<!doctype html>
<html lang="vi">
<head>
  <script>
    if (!window.location.pathname.endsWith('/') && !window.location.pathname.endsWith('.html')) {
      document.write('<base href="' + window.location.pathname + '/">');
    }
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiểm tra năng lực tư duy logic</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="../src/assets/css/variables.css">
  <link rel="stylesheet" href="../src/assets/css/base.css">
  <link rel="stylesheet" href="../src/assets/css/layout.css">
  <link rel="stylesheet" href="../src/assets/css/components/navbar.css">
  <link rel="stylesheet" href="../src/assets/css/components/footer.css">
  <link rel="stylesheet" href="../src/assets/css/components/chatbox.css">
  <link rel="stylesheet" href="../src/assets/css/components/backtotop.css">
  <link rel="stylesheet" href="../src/assets/css/components/cards.css">
  <link rel="stylesheet" href="../src/assets/css/pages/quiz.css">
</head>
<body>
  <div id="scrollProgress"></div>
  <div id="navbar-container"></div>

  <section class="container section-padding">
    <div class="text-center mb-5">
      <h2 class="section-title">Hệ thống đánh giá kiến thức thuật toán</h2>
      <p class="section-desc">Hệ thống tự động thiết lập bộ đề thi thử ngẫu nhiên từ kho câu hỏi chuyên ngành cấu trúc mạch số và logic lập trình robot.</p>
    </div>

    <div class="quiz-box">
      <div id="quizIntroArea" class="text-center">
        <h3 class="fw-bold">🎲 Thử thách tư duy hệ thống</h3>
        <p>Bộ câu hỏi đa dạng đo lường khả năng phản xạ giải thuật điều khiển tự động.</p>
        <button class="btn btn-primary btn-lg mt-3" id="btnInitQuiz">Bắt đầu tạo đề thi ngẫu nhiên</button>
      </div>

      <div id="quizActiveGame" style="display: none;">
        <h4 class="fw-bold mb-4" id="targetQuestionPlaceholder"></h4>
        <div id="answerOptionsArea"></div>
        <div id="feedbackBox" class="alert alert-info mt-3" style="display: none;"></div>
        <button class="btn btn-success mt-3" id="forwardBtn" style="display: none;">Chuyển sang câu hỏi tiếp theo</button>
      </div>

      <div id="quizSummaryArea" style="display: none;" class="text-center">
        <h3 class="fw-bold">Báo cáo kết quả bài làm</h3>
        <p id="totalScoreText" class="fs-4 mt-3"></p>
        <button class="btn btn-primary m-2" id="btnRestartQuiz">Thử thách đề thi mới</button>
        <button class="btn btn-outline-secondary m-2" id="btnBackIntro">Trở lại màn hình ban đầu</button>
      </div>
    </div>
  </section>

  <div id="footer-container"></div>
  <div id="backtotop-container"></div>
  <div id="chatbox-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../src/app.js"></script>
</body>
</html>
